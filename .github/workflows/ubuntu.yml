name: Ubuntu

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'QtScrcpy/**'
      - '!QtScrcpy/res/**'
      - '.github/workflows/ubuntu.yml'
      - 'ci/linux/**'
  pull_request:
    paths:
      - 'QtScrcpy/**'
      - '!QtScrcpy/res/**'
      - '.github/workflows/ubuntu.yml'
      - 'ci/linux/**'

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04

    container:
      image: ubuntu:20.04
      options: --privileged

    strategy:
      matrix:
        qt-ver: [5.15.2]
        qt-arch-install: [gcc_64]
        gcc-arch: [x64]

    env:
      target-name: QtScrcpy
      qt-install-path: ${{ github.workspace }}/Qt/${{ matrix.qt-ver }}
      platform-des: ubuntu
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: 1

    steps:
      - name: Install base dependencies
        run: |
          apt-get update
          apt-get install -y \
            git ca-certificates sudo \
            build-essential \
            libglew-dev libglfw3-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype6-dev \
            libxrender-dev libxext-dev \
            imagemagick wget patchelf zip \
            python3 python3-pip \
            fuse libasound2-dev \
            gnupg lsb-release
          
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ focal main' | tee /etc/apt/sources.list.d/kitware.list >/dev/null
          apt-get update
          apt-get install -y cmake

      - name: Setup FUSE
        run: |
          if [ ! -e /dev/fuse ]; then
            mknod /dev/fuse c 10 229 || true
            chmod 666 /dev/fuse || true
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          ssh-key: ${{ secrets.BOT_SSH_KEY }}

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.qt-install-path }}/${{ matrix.qt-arch-install }}
          key: ubuntu-20.04-${{ matrix.qt-ver }}-${{ matrix.qt-arch-install }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.1.1
        with:
          version: ${{ matrix.qt-ver }}
          target: desktop
          arch: ${{ matrix.qt-arch-install }}
          cached: ${{ steps.cache-qt.outputs.cache-hit }}
          setup-python: false

      - name: Build Release
        shell: bash
        env:
          ENV_QT_PATH: ${{ env.qt-install-path }}
        run: |
          python3 ci/generate-version.py
          chmod +x ci/linux/build_for_linux.sh
          ci/linux/build_for_linux.sh Release

      - name: Get Version
        id: get-version
        shell: bash
        run: echo "version=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Package AppImage
        shell: bash
        env:
          ENV_QT_PATH: ${{ env.qt-install-path }}
        run: |
          chmod +x ci/linux/package_appimage.sh
          ci/linux/package_appimage.sh Release

      - name: Rename AppImage
        id: rename
        shell: bash
        run: |
          APPIMAGE=$(find output/appimage -name "*.AppImage" -type f | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "AppImage not found"
            exit 1
          fi
          FINAL_NAME="${{ env.target-name }}-${{ env.platform-des }}-${{ matrix.gcc-arch }}-${{ steps.get-version.outputs.version }}.AppImage"
          mv "$APPIMAGE" "$FINAL_NAME"
          echo "file=$FINAL_NAME" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.file }}
          path: ${{ steps.rename.outputs.file }}

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.rename.outputs.file }}
          asset_name: ${{ steps.rename.outputs.file }}
          tag: ${{ steps.get-version.outputs.version }}
          overwrite: true
